# Raw counts; the pipeline normalizes them itself (cf-normalization + TMM, authors' factors).
name: moore2025_raw
description: Moore et al. 2025 cfRNA PDAC, raw counts normalized at load time with the authors' factors
matrix:
  path: ${PDAC_DATA_ROOT}/pdac_genecount.csv
  orientation: genes_by_samples
normalization:
  factors: ${PDAC_DATA_ROOT}/updated_intrinsic.csv
metadata:
  path: ${PDAC_DATA_ROOT}/pdac_meta.csv
  sample_id_column: SeqID
  label_column: Pancreatitis_type
  cohort_column: Cohort
class_map:
  PDAC: 1
  Benign Pancreas: 0
  Pancreatitis: 0
  IPMN: 0
  Islet Cell Tumor: 0
  Cancer_other: 0
positive_class: 1
unmapped: error
split:
  train_cohorts: [CEDAR]
  validation_cohorts: [BCC]

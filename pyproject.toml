[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdac-cfrna"
version = "0.1.0"
description = "Replication and improvement of cfRNA-based PDAC classification (Moore et al., Nat Commun 2025)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "imbalanced-learn>=0.12",
    "scipy>=1.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "filelock>=3.13",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=3.7",
    "jupyterlab>=4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdac_cfrna"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY", "PD"]


[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: tests that need the real dataset (skipped in CI)"]
